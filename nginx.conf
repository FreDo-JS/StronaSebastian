server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # przekierowanie /strona -> /strona/ bez doklejania schematu i portu (za reverse proxy)
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Pliki z hashem w nazwie (Vite) - cache 1 rok
    location ~* \.(js|css|woff2|webp|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # fonts.css bez hasha - krótszy cache
    location = /fonts/fonts.css {
        expires 7d;
        add_header Cache-Control "public";
    }

    # robots.txt i sitemap.xml - krótki cache, żeby zmiany szybko trafiały do Google
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Strona główna i podstrony usługowe to pliki <slug>/index.html (prerender).
    # Nieistniejące adresy zwracają prawdziwe 404,
    # a nie index.html z kodem 200 (Google traktuje to jako soft 404)
    location / {
        try_files $uri $uri/ =404;
    }
}
